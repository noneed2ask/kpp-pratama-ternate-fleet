[package]
name = "kpp-fleet-frontend"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "DomTokenList", "Element", "Event", "EventTarget", "Headers", "HtmlElement", "HtmlFormControlsCollection", "HtmlFormElement", "HtmlInputElement", "Request", "RequestInit", "RequestMode", "Response", "Window"] }
