<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f7fb">
  <title>Peminjaman Kendaraan Dinas | KPP Pratama Ternate</title>
  <link rel="stylesheet" href="/styles.css?v=fleet-1">
</head>
<body>
  <main class="page-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">🚘</div>
        <div>
          <p class="eyebrow">KPP PRATAMA TERNATE</p>
          <h1>Peminjaman Kendaraan</h1>
          <p class="subtitle">Armada kendaraan dinas</p>
        </div>
      </div>
      <div class="overview">
        <div class="today"><span>Hari ini</span><strong id="today">Memuat tanggal...</strong></div>
        <div class="availability"><span class="availability-dot"></span><strong id="availableCount">0</strong><span>kendaraan tersedia</span></div>
      </div>
    </header>

    <section class="fleet-section" aria-labelledby="fleetTitle">
      <div class="section-heading">
        <div>
          <p class="eyebrow">ARMADA</p>
          <h2 id="fleetTitle">Pilih kendaraan</h2>
          <p class="section-description">Pilih kendaraan untuk mencatat peminjaman atau pengembaliannya.</p>
        </div>
        <div class="legend"><span class="status available">Tersedia</span><span class="status booked">Dipinjam</span></div>
      </div>
      <div id="fleet" class="fleet-grid" aria-live="polite"></div>
    </section>
    <footer>Data peminjaman disimpan pada perangkat ini.</footer>
  </main>

  <div id="backdrop" class="modal-backdrop" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button id="closeModal" class="modal-close" type="button" aria-label="Tutup">×</button>
      <div id="modalContent"></div>
    </section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module">
    import init from "/pkg/kpp_fleet_frontend.js";
    init();
  </script>
</body>
</html>
